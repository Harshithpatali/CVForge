name: CVForge Backend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cvforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cvforge_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q app alembic

      - name: Apply migrations to PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cvforge_test
        run: alembic upgrade head

      - name: Run regression tests
        env:
          DATABASE_URL: sqlite+pysqlite:///:memory:
        run: pytest -q
